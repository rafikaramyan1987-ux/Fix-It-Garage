name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Job validator (every job solvable, clues identify the faults, rewards fit the curve, Relaxed suspects put the true faults in the top 3 and the hints alone solve every job; writes docs/jobs-report.md)
        run: npm run validate:jobs
      - name: Job validator report is up to date
        run: git diff --exit-code docs/jobs-report.md
      - name: Translations (every language file has all keys of en.json)
        run: npm run check:i18n
      - name: Builds (crazygames, web, gd, gamepix)
        run: |
          npm run build
          npm run build:web
          npm run build:gd
          npm run build:gamepix
      - name: Each portal's SDK only in its own build
        run: |
          ! grep -rqi "sdk.crazygames.com" dist-gd dist-web dist-gamepix
          ! grep -rqi "gamedistribution.com" dist dist-web dist-gamepix
          ! grep -rqi "gamepix.sdk.js" dist dist-web dist-gd
      - name: GamePix bundle declares the legacy sound handlers and reads GamePix.lang()
        run: |
          check() { # $1 = label, $2 = file with the bundle's JS
            for re in 'GamePix\.soundOff\s*=[^=]' 'GamePix\.soundOn\s*=[^=]' 'GamePix\.lang\(\)'; do
              grep -qE "$re" "$2" || { echo "::error::$1 has no match for $re"; exit 1; }
            done
            echo "ok $1"
          }
          cat dist-gamepix/assets/*.js > "$RUNNER_TEMP/gpx-dist.js"
          check dist-gamepix "$RUNNER_TEMP/gpx-dist.js"
          zip=$(ls submission-gamepix/*-gamepix-v*.zip | sort -V | tail -1)
          unzip -p "$zip" 'assets/*.js' > "$RUNNER_TEMP/gpx-zip.js"
          check "$zip" "$RUNNER_TEMP/gpx-zip.js"
      - name: Build size budget (< 8 MB each)
        run: for d in dist dist-web dist-gd dist-gamepix; do node scripts/check-size.mjs $d; done
      - name: Submission zips (newest of each portal + web is this version, index.html at the root, store text limits)
        run: |
          npm run submission
          npm run submission:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run build:gamepix
      - run: npm run test:e2e

  web:
    # open portals (itch.io, Newgrounds, Y8, Playgama): the ad-free web build as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Web build + zip
        run: npm run build:web && node scripts/web/zip.mjs ci-web/fix-it-garage-web.zip
      - name: Web zip checks (index.html at the root, no crazygames / gamedistribution / gamepix / googlesyndication, no http(s) request at runtime, iframe 640x480 / 960x600 / 1280x720 / 390x844, first job played)
        run: node scripts/web/check.mjs ci-web/fix-it-garage-web.zip --shots ci-web/checks
      - name: Newest committed zip (submission-web/fix-it-garage-web-v*.zip) passes the same file checks
        run: node scripts/web/check.mjs "$(ls submission-web/fix-it-garage-web-v*.zip | sort -V | tail -1)" --static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-zip-checks
          path: ci-web/

  playgama:
    # Playgama: Playgama Bridge from Playgama's CDN, initialized before the game bundle runs, as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playgama build
        run: npm run build:playgama
      - name: Playgama build calls bridge.initialize() before the game bundle and sends the documented game_ready
        run: |
          f=dist-playgama/index.html
          head -c 400 $f | grep -qF '<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>' || { echo "$f: Bridge CDN script is not the first script in <head>"; exit 1; }
          grep -qF 'window.bridge.initialize()' $f || { echo "$f: no bridge.initialize() call"; exit 1; }
          grep -qF '<script type="text/plain" data-playgama-game' $f || { echo "$f: game bundle not held until bridge.initialize() settles"; exit 1; }
          ! grep -q '<script type="module"' $f || { echo "$f: a module script runs before bridge.initialize() settles"; exit 1; }
          grep -qF 'console.error(' $f || { echo "$f: initialize failure would be silent"; exit 1; }
          grep -qE "[\"'\`]game_ready[\"'\`]" dist-playgama/assets/*.js || { echo "dist-playgama/assets: no game_ready message"; exit 1; }
          grep -qF '.sendMessage(' dist-playgama/assets/*.js || { echo "dist-playgama/assets: no platform.sendMessage call"; exit 1; }
          echo "OK: $f initializes Bridge first and the game sends game_ready"
      - name: Playgama zip checks (index.html at the root, CDN Bridge first in <head>, initialize() before the game, game_ready, no crazygames / gamedistribution / gamepix, Playgama's precheck with no FAIL / WARN)
        run: node scripts/playgama/zip.mjs ci-playgama/fix-it-garage-playgama.zip && node scripts/playgama/check.mjs ci-playgama/fix-it-garage-playgama.zip
      - name: Committed zip (submission-playgama/fix-it-garage-playgama-v3.zip) passes the same checks
        run: node scripts/playgama/check.mjs submission-playgama/fix-it-garage-playgama-v3.zip
      - name: Playgama QA Tool harness (?platform_id=qa_tool; Bridge's initialize handshake, game_ready; failures logged, game playable)
        run: |
          node scripts/playgama/qa.mjs ci-playgama/fix-it-garage-playgama.zip
          node scripts/playgama/qa.mjs submission-playgama/fix-it-garage-playgama-v3.zip
      - name: Bridge test (mock platform + stubbed Playgama SDK; interstitial, rewarded completed / cancelled, muted during ads)
        run: node scripts/playgama/test.mjs ci-playgama/fix-it-garage-playgama.zip
      - name: The other builds never contain Playgama Bridge
        run: |
          npm run build
          npm run build:web
          npm run build:gd
          npm run build:gamepix
          for f in dist dist-web dist-gd dist-gamepix; do if grep -rq -e playgama-bridge -e bridge.playgama.com $f || test -e $f/playgama-bridge.js; then echo "$f has Playgama Bridge"; exit 1; fi; done

  gamemonetize:
    # GameMonetize: window.SDK_OPTIONS + api.gamemonetize.com/sdk.js loaded once at boot; interstitials only at natural
    # breaks after a click; no rewarded ads (the SDK has none); a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: GameMonetize adapter unit test (pause + mute, resume, settles once, pre-roll + 2-minute gap, no rewarded)
        run: npx vitest run tests/unit/gamemonetize.test.ts
      - name: GameMonetize build
        run: npm run build:gamemonetize
      - name: Build size budget (< 8 MB)
        run: node scripts/check-size.mjs dist-gamemonetize
      - name: GameMonetize zip checks (index.html at the root, relative paths, only sdk.js external, game ID, no other portal SDK, images 512x384 / 512x512 / 512x340 JPEG < 300 KB, form text limits)
        run: node scripts/gamemonetize/zip.mjs ci-gamemonetize/fix-it-garage-gamemonetize.zip
      - name: Committed zip (submission-gamemonetize/fix-it-garage-gamemonetize-v1.zip) passes the same checks
        run: node scripts/gamemonetize/check.mjs submission-gamemonetize/fix-it-garage-gamemonetize-v1.zip
      - name: Playwright smoke test of dist-gamemonetize (stubbed SDK; loads, no ad before Play, ad pauses + mutes, a job is played, no rewarded buttons, ad blocker, no console errors)
        run: npm run test:e2e:gamemonetize
      - name: The other builds never contain the GameMonetize SDK
        run: |
          npm run build
          npm run build:web
          npm run build:gd
          npm run build:gamepix
          npm run build:playgama
          for f in dist dist-web dist-gd dist-gamepix dist-playgama; do if grep -rqi -e gamemonetize -e 13mqh7opto5pk2mgoctppra0kqiz1mue $f; then echo "$f has GameMonetize code"; exit 1; fi; done

  y8:
    # Y8: y8.min.js from Y8's CDN (async, never bundled), initialized as the portal snippet; start / next interstitials
    # only from clicks, rewarded only after adViewed; pause + mute on hidden / blur; a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Media tools (ffprobe for the videos, ImageMagick identify for the images)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg imagemagick
      - name: Y8 adapter unit test (portal init snippet, beforeAd / afterAd, settles once, reward only on adViewed, visibility / blur pause)
        run: npx vitest run tests/unit/y8.test.ts
      - name: Y8 build
        run: npm run build:y8
      - name: Build size budget (< 8 MB)
        run: node scripts/check-size.mjs dist-y8
      - name: Y8 zip + media checks (index.html at the root, relative paths, CDN SDK async in <head>, no bundled SDK, no other ad network; every media file at its exact size and limit)
        run: node scripts/y8/zip.mjs ci-y8/fix-it-garage-y8.zip
      - name: Committed zip (submission-y8/fix-it-garage-y8-v1.zip) passes the same checks
        run: node scripts/y8/check.mjs submission-y8/fix-it-garage-y8-v1.zip
      - name: Playwright smoke test of dist-y8 (stubbed SDK; loads, no ad before init, start / next ads pause + mute, a job is played, rewarded, hidden / blur pause, ad blocker, no console errors)
        run: npm run test:e2e:y8
      - name: The other builds never contain the Y8 SDK
        run: |
          npm run build
          npm run build:web
          npm run build:gd
          npm run build:gamepix
          npm run build:playgama
          npm run build:gamemonetize
          for f in dist dist-web dist-gd dist-gamepix dist-playgama dist-gamemonetize; do if grep -rqi -e cdn.y8.com -e y8sdk -e 6af4b1977eafcdc5d5d7a543 $f; then echo "$f has Y8 code"; exit 1; fi; done
