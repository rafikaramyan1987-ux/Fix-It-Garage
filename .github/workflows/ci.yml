name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Job validator (every job solvable, clues identify the faults, rewards fit the curve; writes docs/jobs-report.md)
        run: npm run validate:jobs
      - name: Translations (every language file has all keys of en.json)
        run: npm run check:i18n
      - name: Builds (crazygames, web, gd, gamepix)
        run: |
          npm run build
          npm run build:web
          npm run build:gd
          npm run build:gamepix
      - name: Each portal's SDK only in its own build
        run: |
          ! grep -rqi "sdk.crazygames.com" dist-gd dist-web dist-gamepix
          ! grep -rqi "gamedistribution.com" dist dist-web dist-gamepix
          ! grep -rqi "gamepix.sdk.js" dist dist-web dist-gd
      - name: Build size budget (< 8 MB each)
        run: for d in dist dist-web dist-gd dist-gamepix; do node scripts/check-size.mjs $d; done
      - name: Submission zips (index.html at the root, store text limits)
        run: |
          npm run submission
          npm run submission:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run build:gamepix
      - run: npm run test:e2e
