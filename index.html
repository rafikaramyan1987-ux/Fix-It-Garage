<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff7a45" />
    <meta name="description" content="Fix It Garage: diagnose broken cars from clues, swap the right parts and hand them back to happy customers. A cozy 3D car repair game." />
    <title>Fix It Garage</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff7a45'/%3E%3Cpath d='M40 14a10 10 0 0 0-9 14L16 43a4 4 0 0 0 6 6l15-15a10 10 0 0 0 13-12l-6 6-6-2-2-6 6-6z' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f4e8d2; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(circle at 50% 35%, #ffe7c2, #f6c58f); z-index: 50; font-family: system-ui, sans-serif; transition: opacity .35s; }
      #boot .logo { width: 112px; height: 112px; border-radius: 28px; background: #ff7a45; box-shadow: 0 10px 0 #d85a2a, 0 18px 30px rgba(120,60,20,.3); display: grid; place-items: center; animation: bob 1.4s ease-in-out infinite; }
      #boot h1 { margin: 0; color: #5a3418; font-size: 30px; letter-spacing: .5px; }
      #boot .bar { width: min(280px, 70vw); height: 16px; border-radius: 10px; background: rgba(90,52,24,.15); overflow: hidden; }
      #boot .fill { height: 100%; width: 4%; border-radius: 10px; background: linear-gradient(90deg, #ff9a5a, #ff7a45); transition: width .2s; }
      @keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="logo"><svg width="64" height="64" viewBox="0 0 64 64"><path d="M40 14a10 10 0 0 0-9 14L16 43a4 4 0 0 0 6 6l15-15a10 10 0 0 0 13-12l-6 6-6-2-2-6 6-6z" fill="#fff"/></svg></div>
      <h1>Fix It Garage</h1>
      <div class="bar"><div class="fill" id="boot-fill"></div></div>
    </div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
